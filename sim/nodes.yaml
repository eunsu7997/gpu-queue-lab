# Two simulated GPU workers (2 x nvidia.com/gpu each) managed by KWOK.
apiVersion: v1
kind: Node
metadata:
  name: gpu-worker-1
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/hostname: gpu-worker-1
    type: kwok
    gpuq.dev/gpu-node: "true"
status:
  allocatable: {cpu: "8", memory: 32Gi, pods: "110", nvidia.com/gpu: "2"}
  capacity: {cpu: "8", memory: 32Gi, pods: "110", nvidia.com/gpu: "2"}
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-worker-2
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/hostname: gpu-worker-2
    type: kwok
    gpuq.dev/gpu-node: "true"
status:
  allocatable: {cpu: "8", memory: 32Gi, pods: "110", nvidia.com/gpu: "2"}
  capacity: {cpu: "8", memory: 32Gi, pods: "110", nvidia.com/gpu: "2"}
