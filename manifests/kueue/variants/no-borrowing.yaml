# Baseline for scenario S4: strict per-team quota, no cohort.
# An idle team's GPUs stay idle. Apply instead of 02-cluster-queues.yaml.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a-cq
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: team-a
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: gpu-node
          resources:
            - name: cpu
              nominalQuota: 2
            - name: memory
              nominalQuota: 2Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-b-cq
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: team-b
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: gpu-node
          resources:
            - name: cpu
              nominalQuota: 2
            - name: memory
              nominalQuota: 2Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
